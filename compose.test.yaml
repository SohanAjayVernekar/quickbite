name: quickbite-tests
services:
  postgres-test:
    image: postgres:17.6-bookworm
    environment: {POSTGRES_USER: quickbite, POSTGRES_PASSWORD: test-only-password, POSTGRES_DB: quickbite_test}
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbite -d quickbite_test"]
      interval: 2s
      retries: 20
  rabbitmq-test:
    image: rabbitmq:4.3.6-management
    environment: {RABBITMQ_DEFAULT_USER: quickbite, RABBITMQ_DEFAULT_PASS: test-only-password}
    ports: ["127.0.0.1:55672:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      retries: 20
