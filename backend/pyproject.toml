[project]
name = "quickbite-backend"
version = "1.0.0"
description = "QuickBite transactional food ordering API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.1",
  "uvicorn==0.34.3",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "SQLAlchemy==2.0.41",
  "asyncpg==0.30.0",
  "alembic==1.16.2",
  "aio-pika==9.5.5",
  "PyJWT==2.10.1",
  "argon2-cffi==25.1.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==8.4.1", "pytest-asyncio==1.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL and RabbitMQ"]

[tool.uv]
package = false
