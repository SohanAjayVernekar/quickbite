server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location = /healthz { access_log off; return 200 "alive\n"; }
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Request-ID $http_x_request_id; proxy_read_timeout 20s; }
  location /health/ { proxy_pass http://api:8000; }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|wasm|json)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
}
