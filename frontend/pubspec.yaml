name: quickbite
description: QuickBite food delivery order processing client
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: 1.0.8
  provider: 6.1.5+1
  go_router: 16.2.1
  http: 1.4.0
  shared_preferences: 2.5.3
  flutter_secure_storage: 9.2.4
  uuid: 4.5.1
  intl: 0.20.2
  model_viewer_plus: ^1.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/generated/
    - assets/images/photo/
    - assets/models/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
