name: quickbite
x-backend: &backend
  image: quickbite-backend:1.0.0
  build: ./backend
  env_file: .env
  restart: unless-stopped
  init: true
  stop_grace_period: 35s
  depends_on:
    postgres:
      condition: service_healthy
x-worker-health: &worker-health
  test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/tmp/quickbite-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime<45"]
  interval: 15s
  timeout: 3s
  start_period: 45s
  retries: 3
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: quickbite
      POSTGRES_USER: quickbite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/prepare_env.py}
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbite -d quickbite"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-quickbite}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/prepare_env.py}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports: ["127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
  migrate:
    <<: *backend
    profiles: [tools]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
  seed:
    <<: *backend
    profiles: [tools]
    restart: "no"
    command: ["python", "-m", "app.database.seed"]
  seed-orders:
    <<: *backend
    profiles: [tools]
    restart: "no"
    command: ["python", "-m", "app.database.seed_orders"]
  api:
    <<: *backend
    ports: ["${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 3
  payment-worker:
    <<: *backend
    command: ["python", "-m", "workers.payment"]
    healthcheck: *worker-health
  restaurant-worker:
    <<: *backend
    command: ["python", "-m", "workers.restaurant"]
    healthcheck: *worker-health
  delivery-worker:
    <<: *backend
    command: ["python", "-m", "workers.delivery"]
    healthcheck: *worker-health
  notification-worker:
    <<: *backend
    command: ["python", "-m", "workers.notification"]
    healthcheck: *worker-health
  outbox-dispatcher:
    <<: *backend
    command: ["python", "-m", "app.messaging.dispatcher"]
    healthcheck: *worker-health
  retry-scheduler:
    <<: *backend
    command: ["python", "-m", "app.messaging.retry_scheduler"]
    healthcheck: *worker-health
  flutter-web:
    image: quickbite-web:1.0.0
    build:
      context: ./frontend
      args:
        API_BASE_URL: ${WEB_API_BASE_URL-http://localhost:8000}
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"]
    restart: unless-stopped
    depends_on: [api]
volumes:
  postgres-data:
  rabbitmq-data:
